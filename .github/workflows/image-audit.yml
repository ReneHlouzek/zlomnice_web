name: Image audit
on:
  push:
    paths-ignore:
      - ".github/image-audit-report.txt"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit images
        run: |
          {
            echo "Image audit generated $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo -e "FILE\tBYTES\tWIDTH\tHEIGHT\tFORMAT\tALPHA"
            find assets -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.avif' \) -print0 |
              sort -z |
              while IFS= read -r -d '' f; do
                bytes=$(stat -c%s "$f")
                info=$(identify -format '%w\t%h\t%m\t%[channels]' "$f" 2>/dev/null || echo "ERROR")
                echo -e "$f\t$bytes\t$info"
              done
          } > .github/image-audit-report.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/image-audit-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Add image audit report"
          git push
