name: Image audit
on:
  push:
    paths-ignore:
      - ".github/image-audit-report.txt"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit images
        run: |
          python3 <<'PY'
          import os, struct
          from datetime import datetime, timezone

          def png_info(p):
              with open(p, 'rb') as f:
                  h = f.read(26)
              if h[:8] != b'\x89PNG\r\n\x1a\n':
                  return None
              w, hgt = struct.unpack('>II', h[16:24])
              color_type = h[25]
              return w, hgt, 'PNG', color_type in (4, 6)

          def jpeg_info(p):
              with open(p, 'rb') as f:
                  data = f.read()
              if data[:2] != b'\xff\xd8':
                  return None
              i = 2
              while i < len(data) - 9:
                  if data[i] != 0xFF:
                      i += 1
                      continue
                  while i < len(data) and data[i] == 0xFF:
                      i += 1
                  if i >= len(data):
                      break
                  marker = data[i]; i += 1
                  if marker in (0xD8, 0xD9):
                      continue
                  if i + 2 > len(data):
                      break
                  length = struct.unpack('>H', data[i:i+2])[0]
                  if marker in list(range(0xC0,0xC4))+list(range(0xC5,0xC8))+list(range(0xC9,0xCC))+list(range(0xCD,0xD0)):
                      if i + 7 <= len(data):
                          hgt, w = struct.unpack('>HH', data[i+3:i+7])
                          return w, hgt, 'JPEG', False
                  i += length
              return None

          rows = []
          for root, _, files in os.walk('assets'):
              for name in files:
                  if not name.lower().endswith(('.png','.jpg','.jpeg','.webp','.avif')):
                      continue
                  p = os.path.join(root, name)
                  size = os.path.getsize(p)
                  info = png_info(p) if name.lower().endswith('.png') else jpeg_info(p) if name.lower().endswith(('.jpg','.jpeg')) else None
                  rows.append((p,size,*info) if info else (p,size,'?','?','?','?'))
          rows.sort()
          with open('.github/image-audit-report.txt','w',encoding='utf-8') as out:
              out.write('Image audit generated ' + datetime.now(timezone.utc).isoformat() + '\n\n')
              out.write('FILE\tBYTES\tWIDTH\tHEIGHT\tFORMAT\tALPHA\n')
              for row in rows:
                  out.write('\t'.join(map(str,row))+'\n')
          PY
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/image-audit-report.txt
          git diff --cached --quiet && exit 0
          git commit -m "Refresh image audit report"
          git push
