name: Optimize images
on:
  push:
    paths:
      - ".github/workflows/optimize-images.yml"
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert PNG assets to WebP
        run: |
          set -e
          find assets -type f -iname '*.png' -print0 | while IFS= read -r -d '' f; do
            out="${f%.png}.webp"
            cwebp -quiet -mt -m 6 -q 88 -alpha_q 90 "$f" -o "$out"
          done
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet && exit 0
          git commit -m "Optimize PNG assets as WebP"
          git push
