<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Zlomnice – nový web se připravuje.">
<title>Zlomnice</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202a;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(900px,100%);padding:72px 32px;text-align:center;background:#fff;border-radius:28px;box-shadow:0 20px 60px #00000012}
.mark{display:grid;place-items:center;margin:auto;width:78px;height:78px;border-radius:22px;background:#17202a;color:#fff;font-size:34px;font-weight:800}
h1{font-size:clamp(52px,11vw,100px);line-height:.9;margin:28px 0 20px;letter-spacing:-.07em}p{font-size:clamp(18px,3vw,25px);color:#59636e;line-height:1.5;max-width:680px;margin:auto}.status{display:inline-block;margin-top:34px;padding:9px 16px;border:1px solid #e1e5e9;border-radius:999px;color:#59636e;font-size:14px}
</style>
</head>
<body><main><div class="mark">Z</div><h1>ZLOMNICE</h1><p>Nový web právě vzniká. Tohle je první testovací verze projektu.</p><div class="status">GitHub Pages ✓</div></main></body>
</html>
